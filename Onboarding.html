<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onboarding Milestones</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #334155; margin: 0; padding: 40px 20px; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 32px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h1 { margin-top: 0; color: #0f172a; font-size: 24px; }
    .progress-box { margin-bottom: 24px; }
    .progress-bar-bg { width: 100%; height: 10px; background: #e2e8f0; border-radius: 5px; overflow: hidden; margin-top: 8px; }
    .progress-bar-fill { height: 100%; width: 0%; background: #3b82f6; transition: width 0.3s; }
    .item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
    .item input { margin-top: 4px; width: 18px; height: 18px; cursor: pointer; }
    .item label { cursor: pointer; }
    .title { font-weight: 600; color: #1e293b; }
    .desc { font-size: 13px; color: #64748b; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌱 新人入職里程碑</h1>
    <div class="progress-box">
      <span id="progress-text">完成進度：0%</span>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="fill"></div></div>
    </div>
    <div class="item">
      <input type="checkbox" id="m1" onchange="updateProgress()">
      <label for="m1"><div class="title">Day 1-3：環境與權限配置</div><div class="desc">開通信箱、加入內部通訊群組、確認硬體設備正常。</div></label>
    </div>
    <div class="item">
      <input type="checkbox" id="m2" onchange="updateProgress()">
      <label for="m2"><div class="title">Day 30：業務流程熟悉</div><div class="desc">完成基礎產品培訓、了解團隊核心指標與協作窗口。</div></label>
    </div>
    <div class="item">
      <input type="checkbox" id="m3" onchange="updateProgress()">
      <label for="m3"><div class="title">Day 60-90：獨立交付與期中回顧</div><div class="desc">獨立接手第一個專案，並與主管進行 1-on-1 試用期目標對齊。</div></label>
    </div>
  </div>
  <script>
    function updateProgress() {
      const total = document.querySelectorAll('input[type="checkbox"]').length;
      const checked = document.querySelectorAll('input[type="checkbox"]:checked').length;
      const pct = Math.round((checked / total) * 100);
      document.getElementById('fill').style.width = pct + '%';
      document.getElementById('progress-text').innerText = '完成進度：' + pct + '%';
    }
  </script>
</body>
</html>
